<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Apna Editor annotate</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 13px "Segoe UI", system-ui, sans-serif; color: #fff; user-select: none; }
  canvas { position: fixed; inset: 0; }
  body.drawing { cursor: crosshair; background: rgba(0, 0, 0, 0.01); }
  #bar { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); display: none; gap: 4px; align-items: center; padding: 6px 8px; border-radius: 12px; background: rgba(20, 20, 26, 0.92); box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4); }
  body.drawing #bar { display: flex; }
  #bar button { border: 0; border-radius: 8px; padding: 6px 9px; background: transparent; color: #fff; font: inherit; cursor: pointer; }
  #bar button.on { background: #ff3b30; }
  #bar .sw { width: 20px; height: 20px; padding: 0; border-radius: 50%; border: 2px solid transparent; }
  #bar .sw.on { border-color: #fff; background: inherit; }
  #bar .sep { width: 1px; height: 22px; background: rgba(255, 255, 255, 0.2); margin: 0 4px; }
  #chip { position: fixed; top: 10px; right: 12px; padding: 5px 10px; border-radius: 999px; background: rgba(20, 20, 26, 0.85); transition: opacity 0.4s; }
  #chip b { color: #ffd60a; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar"></div>
<div id="chip"></div>
<script src="overlay.js"></script>
</body>
</html>
